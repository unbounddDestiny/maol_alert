<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL ALERT SYSTEM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: #1a1a2e; font-family: 'Arial Black', Arial, sans-serif;
        }
        .container { text-align: center; }
        .alert-button {
            width: 300px; height: 300px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff4444, #cc0000);
            border: 8px solid #ff6666; color: white; font-size: 48px;
            font-weight: bold; cursor: pointer; box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            transition: all 0.2s ease; user-select: none;
        }
        .alert-button:active:not(.disabled) { transform: scale(0.95); }
        .alert-button.disabled {
            background: #555; border-color: #777; box-shadow: none;
            cursor: not-allowed; opacity: 0.5;
        }
        #status { margin-top: 20px; color: white; font-size: 18px; min-height: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <button class="alert-button" id="alertBtn">ALERT</button>
        <div id="status">Loading...</div>
    </div>

    <script>
        // ONLY CONFIG: Your Cloudflare Worker URL
        const WORKER_URL = 'https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev';
        
        const alertBtn = document.getElementById('alertBtn');
        const status = document.getElementById('status');
        const COOLDOWN_MS = 12 * 60 * 60 * 1000;
        
        // Track last alert time locally (synced with server after each send)
        let lastAlertTime = null;

        function checkLocalCooldown() {
            if (!lastAlertTime) return { allowed: true };
            
            const remaining = COOLDOWN_MS - (Date.now() - lastAlertTime);
            if (remaining > 0) {
                return { 
                    allowed: false, 
                    remainingMinutes: Math.ceil(remaining / 60000) 
                };
            }
            return { allowed: true };
        }

        function updateButtonState() {
            const state = checkLocalCooldown();
            if (!state.allowed) {
                alertBtn.classList.add('disabled');
                alertBtn.textContent = `${Math.floor(state.remainingMinutes / 60)}h ${state.remainingMinutes % 60}m`;
                status.textContent = `Cooldown: Wait ${state.remainingMinutes} mins`;
                status.style.color = '#ff6666';
            } else {
                alertBtn.classList.remove('disabled');
                alertBtn.textContent = 'ALERT';
                status.textContent = 'Ready to send';
                status.style.color = '#66ff66';
            }
            return state.allowed;
        }

        // Initialize from localStorage if available
        const storedTime = localStorage.getItem('lastAlertTime');
        if (storedTime) lastAlertTime = parseInt(storedTime);
        
        setInterval(updateButtonState, 60000);
        updateButtonState();

        alertBtn.addEventListener('click', async () => {
            if (!updateButtonState()) return;

            status.textContent = 'Sending email alert...';
            
            try {
                // Step 1: Send email via Worker
                const emailRes = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'send_email' })
                });

                const emailData = await emailRes.json();
                if (!emailRes.ok) throw new Error(emailData.error || 'Email failed');

                // Step 2: Update DB timestamp via Worker (bypasses all RLS)
                const dbRes = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'update_timestamp' })
                });

                const dbData = await dbRes.json();
                if (!dbRes.ok) throw new Error(dbData.error || 'DB update failed');

                // Step 3: Update local cooldown state
                lastAlertTime = Date.now();
                localStorage.setItem('lastAlertTime', lastAlertTime.toString());
                
                status.textContent = '✓ Email Alert Sent!';
                status.style.color = '#66ff66';
                updateButtonState();

            } catch (err) {
                console.error('Alert failed:', err);
                status.textContent = ` Error: ${err.message}`;
                status.style.color = '#ff6666';
            }
        });
    </script>
</body>
</html>
