<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL ALERT SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            font-family: 'Arial Black', Arial, sans-serif;
        }
        .container { text-align: center; }
        .alert-button {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff4444, #cc0000);
            border: 8px solid #ff6666;
            color: white;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            transition: all 0.2s ease;
            user-select: none;
        }
        .alert-button:active:not(.disabled) { transform: scale(0.95); }
        .alert-button.disabled {
            background: #555;
            border-color: #777;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.5;
        }
        #status {
            margin-top: 20px;
            color: white;
            font-size: 18px;
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="alert-button" id="alertBtn">ALERT</button>
        <div id="status">Loading...</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const alertBtn = document.getElementById('alertBtn');
        const status = document.getElementById('status');
        const COOLDOWN_MS = 12 * 60 * 60 * 1000; // 12 hours in milliseconds

        async function checkGlobalCooldown() {
            try {
                const { data, error } = await sbClient
                    .from('config')
                    .select('last_alert_at')
                    .eq('id', 1)
                    .single();

                if (error) throw error;
                if (!data || !data.last_alert_at) return { allowed: true };

                const lastSent = new Date(data.last_alert_at).getTime();
                const now = Date.now();
                
                if (now - lastSent < COOLDOWN_MS) {
                    const remainingMinutes = Math.ceil((COOLDOWN_MS - (now - lastSent)) / (1000 * 60));
                    return { allowed: false, remainingMinutes };
                }
                return { allowed: true };
            } catch (err) {
                console.error('Cooldown check failed:', err);
                return { allowed: true }; // Allow on DB error to prevent lockout
            }
        }

        async function updateButtonState() {
            const state = await checkGlobalCooldown();
            if (!state.allowed) {
                alertBtn.classList.add('disabled');
                alertBtn.textContent = `${Math.floor(state.remainingMinutes / 60)}h ${state.remainingMinutes % 60}m`;
                status.textContent = `Global Cooldown: Wait ${state.remainingMinutes} mins`;
                status.style.color = '#ff6666';
            } else {
                alertBtn.classList.remove('disabled');
                alertBtn.textContent = 'ALERT';
                status.textContent = 'Ready to send';
                status.style.color = '#66ff66';
            }
            return state.allowed;
        }

        // Update timer every minute
        setInterval(updateButtonState, 60000);
        updateButtonState();

        alertBtn.addEventListener('click', async () => {
            const isAllowed = await updateButtonState();
            if (!isAllowed) return;

            status.textContent = 'Sending WAKE UP...';
            
            try {
                // 1. Send alert to ntfy.sh
                const ntfyRes = await fetch('https://ntfy.sh/maol_alert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: 'WAKE UP'
                });
                if (!ntfyRes.ok) throw new Error(`ntfy.sh failed: ${ntfyRes.status}`);

                // 2. Update DB timestamp (NO .select() to avoid RLS validation issues)
                const { error } = await sbClient
                    .from('config')
                    .update({ last_alert_at: new Date().toISOString() })
                    .eq('id', 1);

                if (error) throw new Error(`DB update failed: ${error.message}`);

                status.textContent = '✓ Global Alert Sent!';
                status.style.color = '#66ff66';
                updateButtonState();

            } catch (err) {
                console.error('Alert failed:', err);
                status.textContent = `✗ Error: ${err.message}`;
                status.style.color = '#ff6666';
                updateButtonState();
            }
        });
    </script>
</body>
</html>
